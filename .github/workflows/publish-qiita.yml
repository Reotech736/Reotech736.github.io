name: Publish Qiita articles

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"
      - "_config.yml"
      - "qiita/**"
      - "scripts/export-qiita.rb"
      - "test/export_qiita_test.rb"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-qiita.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiita-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test Qiita exporter
        run: ruby test/export_qiita_test.rb

      - name: Check generated Qiita articles
        run: ruby scripts/export-qiita.rb --check

      - name: Publish articles
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: npx qiita publish --all --root qiita

      - name: Commit Qiita metadata
        run: |
          if git diff --quiet -- qiita/public; then
            echo "No Qiita metadata changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiita/public
          git commit -m "chore: update qiita article metadata"
          git push origin HEAD:main
