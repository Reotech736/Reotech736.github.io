<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YOLO26n 640を選んだ理由</title>
  <desc id="desc">s 320からn 640では品質が上がりONNXが小さくなる一方、n 640からm 320では小さな品質向上に対して処理時間、モデルサイズ、メモリが大きく増えることを示す</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbfc"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#087b8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <g font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">
    <text x="90" y="92" fill="#024450" font-size="48" font-weight="700">n / 640を選んだ理由</text>
    <text x="90" y="140" fill="#405a64" font-size="25">追加品質と増える負荷を比較</text>

    <rect x="70" y="235" width="390" height="335" rx="28" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>
    <rect x="605" y="200" width="390" height="390" rx="28" fill="#ffffff" stroke="#087b8a" stroke-width="7"/>
    <rect x="1140" y="235" width="390" height="335" rx="28" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>

    <g text-anchor="middle">
      <text x="265" y="295" fill="#024450" font-size="36" font-weight="800">s / 320</text>
      <text x="800" y="260" fill="#024450" font-size="40" font-weight="800">n / 640</text>
      <text x="1335" y="295" fill="#024450" font-size="36" font-weight="800">m / 320</text>
      <rect x="688" y="280" width="224" height="42" rx="21" fill="#087b8a"/>
      <text x="800" y="309" fill="#ffffff" font-size="21" font-weight="700">今回の折衷点</text>
    </g>

    <g fill="#405a64" font-size="23">
      <text x="120" y="355">person AP</text><text x="410" y="355" text-anchor="end" font-weight="700">49.33</text>
      <text x="120" y="405">car AP</text><text x="410" y="405" text-anchor="end" font-weight="700">31.93</text>
      <text x="120" y="455">PC p50</text><text x="410" y="455" text-anchor="end" font-weight="700">14.05 ms</text>
      <text x="120" y="505">ONNX</text><text x="410" y="505" text-anchor="end" font-weight="700">36.4 MiB</text>

      <text x="655" y="365">person AP</text><text x="945" y="365" text-anchor="end" font-weight="700">52.86</text>
      <text x="655" y="410">car AP</text><text x="945" y="410" text-anchor="end" font-weight="700">37.22</text>
      <text x="655" y="455">PC p50</text><text x="945" y="455" text-anchor="end" font-weight="700">18.03 ms</text>
      <text x="655" y="500">ONNX</text><text x="945" y="500" text-anchor="end" font-weight="700">9.5 MiB</text>
      <text x="655" y="545">memory</text><text x="945" y="545" text-anchor="end" font-weight="700">374.5 MiB</text>

      <text x="1190" y="335">person AP</text><text x="1480" y="335" text-anchor="end" font-weight="700">54.69</text>
      <text x="1190" y="380">car AP</text><text x="1480" y="380" text-anchor="end" font-weight="700">38.23</text>
      <text x="1190" y="425">PC p50</text><text x="1480" y="425" text-anchor="end" font-weight="700">37.94 ms</text>
      <text x="1190" y="470">ONNX</text><text x="1480" y="470" text-anchor="end" font-weight="700">78.0 MiB</text>
      <text x="1190" y="515">memory</text><text x="1480" y="515" text-anchor="end" font-weight="700">435.3 MiB</text>
    </g>

    <rect x="90" y="635" width="680" height="105" rx="24" fill="#e7f5f7" stroke="#3ba3c5" stroke-width="3"/>
    <text x="430" y="675" text-anchor="middle" fill="#024450" font-size="24" font-weight="700">s / 320と比べる</text>
    <text x="430" y="713" text-anchor="middle" fill="#405a64" font-size="22">AP向上・p50 +3.98ms・ONNX −26.9MiB</text>

    <rect x="830" y="635" width="680" height="105" rx="24" fill="#fff8e1" stroke="#d7a62a" stroke-width="3"/>
    <text x="1170" y="675" text-anchor="middle" fill="#024450" font-size="24" font-weight="700">m / 320と比べる</text>
    <text x="1170" y="713" text-anchor="middle" fill="#405a64" font-size="22">APは約1〜2pt差・p50 +19.92ms・ONNX +68.6MiB</text>

    <rect x="480" y="800" width="640" height="58" rx="29" fill="#024450"/>
    <text x="800" y="839" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">折衷点：n / 640</text>
  </g>
</svg>
