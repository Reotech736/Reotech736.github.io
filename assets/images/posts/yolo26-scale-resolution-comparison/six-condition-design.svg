<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YOLO26の6条件</title>
  <desc id="desc">n、s、mの3つのモデル規模と、320、640ピクセルの2つの入力解像度を組み合わせ、6条件を同じFP32、COCO、PC環境で比べる構成</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbfc"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#087b8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <g font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">
    <text x="90" y="92" fill="#024450" font-size="48" font-weight="700">6条件の組み合わせ</text>
    <text x="90" y="140" fill="#405a64" font-size="25">モデル規模 × 入力解像度</text>

    <rect x="565" y="185" width="330" height="64" rx="20" fill="#087b8a"/>
    <rect x="1005" y="185" width="330" height="64" rx="20" fill="#036982"/>
    <text x="730" y="227" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">320 × 320</text>
    <text x="1170" y="227" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">640 × 640</text>

    <text x="180" y="250" fill="#405a64" font-size="24" font-weight="700">モデル規模</text>
    <text x="180" y="282" fill="#6b7d84" font-size="20">下ほど大きい</text>

    <g>
      <circle cx="440" cy="355" r="38" fill="#036982"/>
      <circle cx="440" cy="505" r="46" fill="#087b8a"/>
      <circle cx="440" cy="665" r="56" fill="#3ba3c5"/>
      <text x="440" y="365" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">n</text>
      <text x="440" y="515" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">s</text>
      <text x="440" y="675" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">m</text>
    </g>

    <g>
      <rect x="565" y="300" width="330" height="110" rx="22" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>
      <rect x="1005" y="300" width="330" height="110" rx="22" fill="#ffffff" stroke="#3ba3c5" stroke-width="4"/>
      <rect x="565" y="450" width="330" height="110" rx="22" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>
      <rect x="1005" y="450" width="330" height="110" rx="22" fill="#ffffff" stroke="#3ba3c5" stroke-width="4"/>
      <rect x="565" y="610" width="330" height="110" rx="22" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>
      <rect x="1005" y="610" width="330" height="110" rx="22" fill="#ffffff" stroke="#3ba3c5" stroke-width="4"/>

      <g fill="#024450" font-size="28" font-weight="700" text-anchor="middle">
        <text x="730" y="350">n / 320</text>
        <text x="1170" y="350">n / 640</text>
        <text x="730" y="500">s / 320</text>
        <text x="1170" y="500">s / 640</text>
        <text x="730" y="660">m / 320</text>
        <text x="1170" y="660">m / 640</text>
      </g>

      <g fill="#6b7d84" font-size="20" text-anchor="middle">
        <text x="730" y="382">小さい入力</text>
        <text x="1170" y="382">細かい入力</text>
        <text x="730" y="532">小さい入力</text>
        <text x="1170" y="532">細かい入力</text>
        <text x="730" y="692">小さい入力</text>
        <text x="1170" y="692">細かい入力</text>
      </g>
    </g>

    <rect x="260" y="770" width="1080" height="82" rx="22" fill="#024450"/>
    <text x="800" y="820" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">FP32・COCO val2017・同じPCで比較</text>
  </g>
</svg>
