---
thumbnail_title_lines:
  - text: "YOLO26のモデル規模と"
    size: 52
  - text: "入力解像度を比較"
    size: 54
thumbnail_title_start_y: 250
thumbnail_title_line_gap: 74
---
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#024450"/>
      <stop offset="100%" stop-color="#7eb3bf"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1045" cy="100" r="95" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="1040" cy="535" r="155" fill="#ffffff" fill-opacity="0.08"/>

  <rect x="80" y="90" width="330" height="40" rx="20" fill="#ffffff" fill-opacity="0.18"/>
  <text x="100" y="118" fill="#ffffff" font-size="18" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="600">MODEL SCALE &amp; RESOLUTION</text>

  {% include thumbnail-title-lines.svg lines=page.thumbnail_title_lines start_y=page.thumbnail_title_start_y line_gap=page.thumbnail_title_line_gap %}
  <text x="80" y="430" fill="#ffffff" font-size="26" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" opacity="0.9">n・s・m × 320px・640px</text>

  <g transform="translate(790 135)">
    <rect x="0" y="0" width="330" height="360" rx="28" fill="url(#panel)" fill-opacity="0.96"/>

    <rect x="48" y="34" width="234" height="54" rx="27" fill="#024450"/>
    <text x="165" y="70" text-anchor="middle" fill="#ffffff" font-size="27" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="800" letter-spacing="2">YOLO26</text>

    <g font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="700">
      <text x="143" y="119" text-anchor="middle" fill="#036982" font-size="17">320</text>
      <text x="230" y="119" text-anchor="middle" fill="#036982" font-size="17">640</text>

      <g fill="#036982">
        <circle cx="72" cy="148" r="19"/>
        <circle cx="72" cy="209" r="23" fill-opacity="0.82"/>
        <circle cx="72" cy="278" r="28" fill-opacity="0.66"/>
      </g>
      <g fill="#ffffff" font-size="18" text-anchor="middle">
        <text x="72" y="155">n</text>
        <text x="72" y="216">s</text>
        <text x="72" y="285">m</text>
      </g>
    </g>

    <g fill="none" stroke="#7eb3bf" stroke-width="4">
      <rect x="114" y="129" width="58" height="38" rx="9"/>
      <rect x="201" y="126" width="58" height="44" rx="9"/>
      <rect x="111" y="188" width="64" height="42" rx="9"/>
      <rect x="198" y="185" width="64" height="48" rx="9"/>
      <rect x="108" y="253" width="70" height="50" rx="9"/>
      <rect x="195" y="250" width="70" height="56" rx="9"/>
    </g>

    <g transform="translate(91 316)">
      <rect x="0" y="0" width="148" height="30" rx="15" fill="#036982"/>
      <text x="74" y="22" text-anchor="middle" fill="#ffffff" font-size="17" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="800">6 CONDITIONS</text>
