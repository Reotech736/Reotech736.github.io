<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">FP32とINT8を5回ずつ測った推論時間の範囲</title>
  <desc id="desc">YOLO26nとsのどちらでも5回すべてINT8がFP32より遅く、測定範囲が重ならなかった結果</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbfc"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Noto Sans JP', sans-serif; fill: #17333a; }
      .label { font: 700 25px 'Noto Sans JP', sans-serif; fill: #17333a; }
      .body { font: 500 19px 'Noto Sans JP', sans-serif; fill: #38545b; }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="title">PC推論時間：5回ともINT8が長い</text>

  <rect x="55" y="100" width="525" height="330" rx="22" fill="#ffffff" stroke="#c7d8dc" stroke-width="2"/>
  <text x="317" y="146" text-anchor="middle" class="label">YOLO26n（640px）</text>
  <text x="100" y="207" class="body">FP32</text>
  <text x="195" y="184" class="body">17.692〜18.079 ms</text>
  <rect x="195" y="194" width="180" height="30" rx="10" fill="#036982"/>
  <text x="100" y="287" class="body">INT8</text>
  <text x="195" y="264" class="body">45.020〜45.794 ms</text>
  <rect x="195" y="274" width="330" height="30" rx="10" fill="#3ba3c5"/>
  <text x="317" y="357" text-anchor="middle" class="label">FP32比：2.528〜2.549倍</text>
  <text x="317" y="403" text-anchor="middle" class="body">最速INT8 ＞ 最遅FP32</text>

  <rect x="620" y="100" width="525" height="330" rx="22" fill="#ffffff" stroke="#c7d8dc" stroke-width="2"/>
  <text x="882" y="146" text-anchor="middle" class="label">YOLO26s（640px）</text>
  <text x="665" y="207" class="body">FP32</text>
  <text x="760" y="184" class="body">49.968〜50.460 ms</text>
  <rect x="760" y="194" width="190" height="30" rx="10" fill="#036982"/>
  <text x="665" y="287" class="body">INT8</text>
  <text x="760" y="264" class="body">105.254〜106.021 ms</text>
  <rect x="760" y="274" width="340" height="30" rx="10" fill="#3ba3c5"/>
  <text x="882" y="357" text-anchor="middle" class="label">FP32比：2.093〜2.112倍</text>
  <text x="882" y="403" text-anchor="middle" class="body">最速INT8 ＞ 最遅FP32</text>
</svg>
