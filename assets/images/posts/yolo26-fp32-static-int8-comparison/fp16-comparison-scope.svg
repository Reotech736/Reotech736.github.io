<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FP16を今回の検証候補として棄却した理由</title>
  <desc id="desc">同じONNX Runtime CPU backendで比較できるFP32とINT8を残し、FP16は今回の検証候補として棄却した判断</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbfc"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Noto Sans JP', sans-serif; fill: #17333a; }
      .label { font: 700 25px 'Noto Sans JP', sans-serif; fill: #17333a; }
      .body { font: 500 20px 'Noto Sans JP', sans-serif; fill: #38545b; }
      .small { font: 500 17px 'Noto Sans JP', sans-serif; fill: #5b7177; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="title">FP16を比較対象から外す</text>

  <rect x="55" y="105" width="700" height="300" rx="22" fill="#e8f4f6" stroke="#087b8a" stroke-width="3"/>
  <text x="405" y="148" text-anchor="middle" class="label">同じORT CPU EPで比較</text>
  <rect x="95" y="190" width="275" height="145" rx="18" fill="#ffffff" stroke="#356f9a" stroke-width="3"/>
  <text x="232" y="239" text-anchor="middle" class="label">FP32</text>
  <text x="232" y="278" text-anchor="middle" class="body">基準モデル</text>
  <text x="232" y="310" text-anchor="middle" class="small">ORT CPU EP</text>
  <rect x="440" y="190" width="275" height="145" rx="18" fill="#ffffff" stroke="#3ba3c5" stroke-width="3"/>
  <text x="577" y="239" text-anchor="middle" class="label">static INT8</text>
  <text x="577" y="278" text-anchor="middle" class="body">QDQモデル</text>
  <text x="577" y="310" text-anchor="middle" class="small">ORT CPU EP</text>

  <rect x="820" y="105" width="325" height="300" rx="22" fill="#ffffff" stroke="#7eb3bf" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="982" y="153" text-anchor="middle" class="label">FP16</text>
  <text x="982" y="199" text-anchor="middle" class="body">ONNX生成は可能</text>
  <text x="982" y="239" text-anchor="middle" class="body">標準CPU EPでは</text>
  <text x="982" y="270" text-anchor="middle" class="body">FP16 opsを実行不可</text>
  <rect x="865" y="310" width="235" height="58" rx="29" fill="#024450"/>
  <text x="982" y="347" text-anchor="middle" fill="#ffffff" font-size="21" font-family="Noto Sans JP, sans-serif" font-weight="700">今回対象外</text>

  <text x="600" y="458" text-anchor="middle" class="small">異なるbackendではprecisionだけを比較できない</text>
</svg>
