<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">手動補正を試した結果</title><desc id="desc">ずれを手動補正すると、一部の奥側の石は本来の交点に対応したが、盤全体では誤判定や不明が増えた。今回の試作は採用を見送った。</desc>
  <rect width="1000" height="420" rx="18" fill="#eef6f8"/>
  <g font-family="Noto Sans JP, sans-serif" fill="#173740">
    <text x="40" y="52" font-size="28" font-weight="700">手動補正を試した結果</text>
    <rect x="40" y="88" width="270" height="180" rx="12" fill="#fff" stroke="#7eb3bf" stroke-width="2"/>
    <text x="62" y="125" font-size="22" font-weight="700">試したこと</text>
    <text x="62" y="171" font-size="21">石候補のずれを</text><text x="62" y="206" font-size="21">手動で補正</text>
    <path d="M326 178H351L343 168M351 178L343 188" fill="none" stroke="#087b8a" stroke-width="4"/>
    <rect x="365" y="88" width="270" height="180" rx="12" fill="#d6edf1"/>
    <text x="387" y="125" font-size="22" font-weight="700">一部の奥側の石</text>
    <text x="387" y="171" font-size="21">本来の交点に</text><text x="387" y="206" font-size="21">対応づけられた</text>
    <path d="M651 178H676L668 168M676 178L668 188" fill="none" stroke="#087b8a" stroke-width="4"/>
    <rect x="690" y="88" width="270" height="180" rx="12" fill="#fff0e7" stroke="#d9a179" stroke-width="2"/>
    <text x="712" y="125" font-size="22" font-weight="700">盤全体に適用</text>
    <text x="712" y="171" font-size="21">誤判定や不明が</text><text x="712" y="206" font-size="21">増えた</text>
    <rect x="40" y="300" width="920" height="75" rx="12" fill="#024450"/>
    <text x="65" y="346" font-size="24" fill="#fff" font-weight="700">今回の試作は採用見送り。既存の判定を維持。</text>
  </g>
</svg>
