<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">写真ではなく石配置で分ける</title><desc id="desc">開発用7配置のうち6配置を学習、1配置を検証に使う例。上方と斜めは同じグループ。最終確認用3配置は別に取っておく。</desc>
  <rect width="1000" height="480" rx="18" fill="#eef6f8"/>
  <g font-family="Noto Sans JP, sans-serif" fill="#173740">
    <text x="40" y="52" font-size="29" font-weight="700">同じ石配置の写真は、同じグループへ</text>
    <rect x="40" y="85" width="430" height="132" rx="12" fill="#fff" stroke="#7eb3bf" stroke-width="2"/>
    <text x="60" y="120" font-size="23">配置A：上方 ＋ 斜め</text><text x="60" y="159" font-size="19">角度が違っても、同じ配置</text><text x="60" y="191" font-size="19">学習側と検証側へ分散させない</text>
    <path d="M495 150H547" stroke="#087b8a" stroke-width="5"/><path d="M540 139L554 150L540 161" fill="none" stroke="#087b8a" stroke-width="5"/>
    <rect x="575" y="85" width="385" height="132" rx="12" fill="#d6edf1"/>
    <text x="600" y="123" font-size="24" font-weight="700">開発用：7配置・15枚</text><text x="600" y="163" font-size="21">6配置で学習、1配置で検証</text><text x="600" y="195" font-size="18">どの配置を検証にするかを替えて比較</text>
    <rect x="40" y="258" width="920" height="110" rx="12" fill="#024450"/>
    <text x="64" y="299" font-size="25" fill="#fff" font-weight="700">最終確認用：3配置・6枚（C・H・I）</text><text x="64" y="339" font-size="21" fill="#fff">モデルや設定を決めた後に確認する。それまでは使わない。</text>
    <text x="40" y="421" font-size="19">これは比較方法の案です。学習・最終確認はまだ実行していません。</text>
  </g>
</svg>
