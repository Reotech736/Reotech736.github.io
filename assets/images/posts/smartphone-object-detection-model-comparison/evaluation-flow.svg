<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">今回の物体検出モデル比較の流れ</title>
  <desc id="desc">3候補の利用条件を確認し、YOLO26nとD-FINE-Nを共通320ピクセルでONNX一致、COCO品質、PC速度の順に比較した流れ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbfc"/>
      <stop offset="100%" stop-color="#d9eef2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#087b8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="90" y="92" fill="#024450" font-size="48" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="700">今回の比較でそろえた条件</text>
  <text x="90" y="140" fill="#405a64" font-size="25" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">候補を同じ320×320入力へそろえ、変換・品質・速度を別々に確認</text>

  <g font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">
    <rect x="90" y="205" width="300" height="405" rx="26" fill="#ffffff" stroke="#7eb3bf" stroke-width="4"/>
    <text x="125" y="260" fill="#024450" font-size="29" font-weight="700">1. 比較候補</text>
    <rect x="125" y="300" width="230" height="65" rx="16" fill="#087b8a"/>
    <text x="240" y="342" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">YOLO26n</text>
    <rect x="125" y="385" width="230" height="65" rx="16" fill="#036982"/>
    <text x="240" y="427" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">D-FINE-N</text>
    <rect x="125" y="470" width="230" height="65" rx="16" fill="#d9eef2" stroke="#7eb3bf" stroke-width="3"/>
    <text x="240" y="512" text-anchor="middle" fill="#405a64" font-size="25" font-weight="700">PicoDet-S</text>
    <text x="240" y="568" text-anchor="middle" fill="#6b7d84" font-size="20">条件未確認で除外</text>

    <path d="M410 405H500" fill="none" stroke="#087b8a" stroke-width="7" marker-end="url(#arrow)"/>

    <rect x="530" y="205" width="290" height="405" rx="26" fill="#ffffff" stroke="#3ba3c5" stroke-width="4"/>
    <text x="565" y="260" fill="#024450" font-size="29" font-weight="700">2. 共通入力</text>
    <rect x="575" y="318" width="200" height="200" rx="20" fill="#d9eef2" stroke="#087b8a" stroke-width="5"/>
    <text x="675" y="405" text-anchor="middle" fill="#024450" font-size="38" font-weight="700">320</text>
    <text x="675" y="450" text-anchor="middle" fill="#024450" font-size="25">× 320 px</text>
    <text x="675" y="558" text-anchor="middle" fill="#405a64" font-size="20">候補間で固定</text>

    <path d="M840 405H930" fill="none" stroke="#087b8a" stroke-width="7" marker-end="url(#arrow)"/>

    <rect x="960" y="205" width="550" height="405" rx="26" fill="#ffffff" stroke="#087b8a" stroke-width="4"/>
    <text x="995" y="260" fill="#024450" font-size="29" font-weight="700">3. 3つの確認を分ける</text>
    <rect x="1005" y="302" width="460" height="72" rx="18" fill="#e7f5f7"/>
    <circle cx="1043" cy="338" r="20" fill="#3ba3c5"/>
    <text x="1080" y="348" fill="#024450" font-size="24" font-weight="700">ONNX変換前後が一致するか</text>
    <rect x="1005" y="397" width="460" height="72" rx="18" fill="#e7f5f7"/>
    <circle cx="1043" cy="433" r="20" fill="#087b8a"/>
    <text x="1080" y="443" fill="#024450" font-size="24" font-weight="700">COCOで検出品質を比べる</text>
    <rect x="1005" y="492" width="460" height="72" rx="18" fill="#e7f5f7"/>
    <circle cx="1043" cy="528" r="20" fill="#024450"/>
    <text x="1080" y="538" fill="#024450" font-size="24" font-weight="700">PC CPUで処理時間を比べる</text>
  </g>

  <rect x="260" y="690" width="1080" height="120" rx="24" fill="#024450"/>
  <text x="800" y="744" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="700">同じ条件で比べた結果、YOLO26n 320pxを次の比較基準へ</text>
  <text x="800" y="786" text-anchor="middle" fill="#d9eef2" font-size="22" font-family="Noto Sans JP, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">Androidへ直行せず、モデル規模・解像度・数値精度を順に比較する</text>
</svg>
